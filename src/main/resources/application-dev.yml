spring:
  # Database Configuration (Development)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mydb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  # JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # Email Configuration (Development - Console output)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    # For development, you can use a fake SMTP server like MailHog
  
  # OAuth2 Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          
#          github:
#            client-id: ${GITHUB_CLIENT_ID:your-github-client-id}
#            client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret}
#            scope:
#              - user:email
#              - read:user
#            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
#
#          facebook:
#            client-id: ${FACEBOOK_CLIENT_ID:your-facebook-client-id}
#            client-secret: ${FACEBOOK_CLIENT_SECRET:your-facebook-client-secret}
#            scope:
#              - email
#              - public_profile
#            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:YourSecretKeyHereShouldBeAtLeast256BitsLongForHS256AlgorithmPleaseChangeThisInProduction}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000}  # 1 hour
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 24 hours
  issuer: ${JWT_ISSUER:auth-template}
  audience: ${JWT_AUDIENCE:auth-template-users}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:8081}

# Application Configuration
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  email:
    from: ${EMAIL_FROM:noreply@authtemplate.com}
    verification-expiration: 86400000  # 24 hours
    reset-expiration: 3600000  # 1 hour

# Logging Configuration
logging:
  level:
    com.auth.template: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.boot.context.config: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
