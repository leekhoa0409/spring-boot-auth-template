spring:
  application:
    name: auth-template
  
  profiles:
    active: ${SPRING_PROFILE:dev}

  # JPA Configuration
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Server Configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
