spring:
  application:
    name: auth-template
  
  profiles:
    active: ${SPRING_PROFILE:dev}

  # JPA Configuration
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Server Configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
